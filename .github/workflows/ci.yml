# Safety checks for every change headed to redesign/integration or main.
#
# Nothing here can reach production: the workflow holds no secrets
# (ci/check_ci_isolation.py enforces that), the build points the app at a
# dead local API URL, and no step calls a backend.
name: CI

on:
  pull_request:
    branches: [main, redesign/integration]
  push:
    branches: [main, redesign/integration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Override the committed .env so a CI build can never talk to a real API.
  VITE_API_URL: http://127.0.0.1:9
  VITE_OCR_API_URL: http://127.0.0.1:9
  VITE_GOOGLE_MAPS_API_KEY: ci-dummy

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CI has no production access
        run: python3 ci/check_ci_isolation.py

      - name: No unreviewed delete calls
        if: github.event_name == 'pull_request'
        run: python3 ci/check_delete_calls.py "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint redesign code (must be clean)
        run: npm run --if-present lint:new

      - name: Lint ratchet (no file gets worse)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add .ci-base "origin/${{ github.base_ref }}"
          ln -s ../node_modules .ci-base/node_modules
          (cd .ci-base && npx eslint . --ext ts,tsx -f json -o ../eslint-base.json) || true
          npx eslint . --ext ts,tsx --ignore-pattern .ci-base -f json -o eslint-head.json || true
          node ci/lint-ratchet.cjs eslint-base.json eslint-head.json

      - name: Unit tests
        run: npm run --if-present test

      - name: Build
        run: npm run build

      - name: Playwright smoke tests
        if: hashFiles('playwright.config.ts') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
